<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渠道分包登录测试</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- 自定义样式 -->
    <style>
        :root {
            --primary: #0d6efd;
            --secondary: #6c757d;
            --success: #198754;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #0dcaf0;
            --light: #f8f9fa;
            --dark: #212529;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            max-width: 1400px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: var(--primary);
            position: relative;
        }
        
        .header h1 {
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            color: var(--secondary);
        }
        
        .header::after {
            content: '';
            display: block;
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--info));
            margin: 15px auto;
            border-radius: 2px;
        }
        
        .card {
            margin-bottom: 25px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .card-header {
            background: linear-gradient(to right, var(--primary), #3b71ca);
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            border-radius: 12px 12px 0 0 !important;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-run {
            background: linear-gradient(to right, var(--success), #14a44d);
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 250px;
        }
        
        .btn-run:hover:not(.running) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(25, 135, 84, 0.4);
        }
        
        .btn-run:active {
            transform: translateY(0);
        }
        
        .btn-run.running {
            background: linear-gradient(to right, var(--secondary), #9fa6b2);
            cursor: not-allowed;
        }
        
        .btn-stop {
            background: linear-gradient(to right, var(--danger), #c82333);
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 250px;
            display: none;
        }
        
        .btn-stop:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
            background: linear-gradient(to right, #c82333, #a71e2a);
        }
        
        .btn-stop:active {
            transform: translateY(0);
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        
        .log-container {
            height: 400px;
            overflow-y: auto;
            background-color: #1a1d21;
            color: #20c997;
            font-family: 'Fira Code', 'Courier New', monospace;
            padding: 20px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--light);
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .stats {
            display: flex;
            gap: 15px;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 3px solid transparent;
        }
        
        .log-info {
            border-left-color: var(--info);
        }
        
        .log-success {
            border-left-color: var(--success);
        }
        
        .log-warning {
            border-left-color: var(--warning);
        }
        
        .log-error {
            border-left-color: var(--danger);
        }
        
        .progress {
            height: 8px;
            margin: 15px 0;
        }
        
        .result-summary {
            background-color: var(--light);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        
        .failure-list {
            max-height: 150px;
            overflow-y: auto;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stats {
                flex-direction: column;
                gap: 8px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-link"></i> 分包登录测试工具</h1>
            <p class="text-muted">根据版本号创建工作目录、根据下载链接下载APK</p>
        </div>
        
        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-sliders-h"></i> 输入参数
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label for="version" class="form-label">
                                <i class="fas fa-tag"></i> 分包版本号
                            </label>
                            <input type="text" class="form-control" id="version" placeholder="例如: 1.94、1.94.1">
                        </div>
                        
                        <div class="mb-4">
                            <label for="links" class="form-label">
                                <i class="fas fa-link"></i> 分包下载链接 (每行一个)
                            </label>
                            <textarea class="form-control" id="links" rows="10" placeholder="请输入要测试的链接，每行一个&#10;例如:&#10;http://seafile.evkland.cn/f/d5f9d45260514affacf3/&#10;http://seafile.evkland.cn/f/667c2e88eecb45c7bdf9/"></textarea>
                        </div>
                        
                        <div class="button-group">
                            <button id="runBtn" class="btn btn-run">
                                <i class="fas fa-play-circle"></i> 一键运行测试
                            </button>
                            <button id="stopBtn" class="btn btn-stop">
                                <i class="fas fa-stop-circle"></i> 停止运行
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="result-summary" id="resultSummary">
                    <h5><i class="fas fa-chart-bar"></i> 测试结果摘要</h5>
                    <div class="progress">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div class="stats">
                        <div class="stat-item text-success">
                            <i class="fas fa-check-circle"></i>
                            <span id="successCount">0</span> 成功
                        </div>
                        <div class="stat-item text-danger">
                            <i class="fas fa-times-circle"></i>
                            <span id="errorCount">0</span> 失败
                        </div>
                        <div class="stat-item text-info">
                            <i class="fas fa-clock"></i>
                            <span id="duration">0</span> 秒
                        </div>
                    </div>
                    <div class="mt-3">
                        <p>上一次测试时间: <span id="lastTestTime">无数据</span></p>
                    </div>
                    <div id="failureDetails" style="display: none;">
                        <h6 class="mt-3"><i class="fas fa-exclamation-triangle"></i> 失败包列表:</h6>
                        <ul id="failureList" class="list-group failure-list"></ul>
                    </div>
                </div>

                <!-- 无数据提示 -->
                <div id="noDataMessage" class="alert alert-info mt-3" style="display: none;">
                    <i class="bi bi-info-circle"></i> 暂无测试结果数据
                </div>
            </div>
            
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-terminal"></i> 实时日志
                    </div>
                    <div class="card-body">
                        <div class="loading" id="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2">测试运行中，请稍候...</p>
                        </div>
                        <div class="log-container" id="logContainer">
                            <div class="log-entry log-info">等待测试运行...</div>
                        </div>
                        
                        <div class="status-bar">
                            <div class="stat-item">
                                <i class="fas fa-info-circle"></i>
                                <span id="status">就绪</span>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-list"></i>
                                <span id="lineCount">0</span> 行日志
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 自定义JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const runBtn = document.getElementById('runBtn');
            const stopBtn = document.getElementById('stopBtn');
            const logContainer = document.getElementById('logContainer');
            const loading = document.getElementById('loading');
            const versionInput = document.getElementById('version');
            const linksInput = document.getElementById('links');
            const statusEl = document.getElementById('status');
            const lineCountEl = document.getElementById('lineCount');
            const resultSummary = document.getElementById('resultSummary');
            const progressBar = document.getElementById('progressBar');
            const successCountEl = document.getElementById('successCount');
            const errorCountEl = document.getElementById('errorCount');
            const durationEl = document.getElementById('duration');
            const lastTestTimeEl = document.getElementById('lastTestTime');
            const failureDetails = document.getElementById('failureDetails');
            const failureList = document.getElementById('failureList');
            const noDataMessage = document.getElementById('noDataMessage');
            
            let logUpdateInterval;
            let startTime;
            let logLines = 0;
            let isRunning = false;
            
            // 添加日志函数
            function addLog(message, type = 'info') {
                const now = new Date();
                const timestamp = now.toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${type}`;
                logEntry.innerHTML = `<span style="color: #6c757d">[${timestamp}]</span> ${message}`;
                logContainer.appendChild(logEntry);
                
                // 自动滚动到底部
                logContainer.scrollTop = logContainer.scrollHeight;
                
                // 更新行数
                logLines++;
                lineCountEl.textContent = logLines;
            }
            
            // 更新日志显示
            function updateLogs() {
                if (!isRunning) return;
                
                fetch('/logs')
                    .then(response => response.json())
                    .then(data => {
                        if (data.logs && data.logs.length > 0) {
                            logContainer.innerHTML = '';
                            logLines = 0;
                            
                            data.logs.forEach(log => {
                                let type = 'info';
                                if (log.includes('成功') || log.includes('完成') || log.includes('通过')) type = 'success';
                                if (log.includes('警告') || log.includes('注意')) type = 'warning';
                                if (log.includes('错误') || log.includes('失败')) type = 'error';
                                
                                addLog(log, type);
                            });
                            
                            // 检测测试是否完成
                            if (data.completed) {
                                stopTest('测试完成');
                                updateResults();
                            }
                        }
                    })
                    .catch(error => {
                        console.error('获取日志失败:', error);
                    });
            }
            
            // 停止测试
            function stopTest(reason = '用户停止') {
                clearInterval(logUpdateInterval);
                isRunning = false;
                
                // 发送停止请求到后端（如果是用户停止）
                if (reason === '用户手动停止') {
                    fetch('/stop', {
                        method: 'POST'
                    }).catch(error => {
                        console.error('停止请求失败:', error);
                    });
                }
                
                // 更新UI状态
                loading.style.display = 'none';
                runBtn.classList.remove('running');
                runBtn.disabled = false;
                stopBtn.style.display = 'none';
                statusEl.textContent = reason;
                
                // 添加停止日志
                addLog(`测试已停止: ${reason}`, 'warning');
                
                // 计算执行时间
                if (startTime) {
                    const endTime = new Date();
                    const duration = (endTime - startTime) / 1000;
                    durationEl.textContent = duration.toFixed(1);
                }
            }
            
            // 从本地JSON文件获取测试结果
            async function fetchTestResults() {
                try {
                    const response = await fetch('/api/test-results');
                    
                    if (response.status === 404) {
                        // 文件不存在
                        return null;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    
                    return await response.json();
                    
                } catch (error) {
                    console.warn('获取测试结果失败:', error);
                    return null;
                }
            }
            
            // 验证结果数据格式
            function isValidResults(results) {
                try {
                    if (!results || typeof results !== 'object') {
                        return false;
                    }
                    
                    const requiredFields = ['success', 'failed', 'total', 'failure_pck', 'last_test_time'];
                    
                    // 检查所有必需字段都存在
                    for (const field of requiredFields) {
                        if (!(field in results)) {
                            return false;
                        }
                    }
                    
                    // 检查数据类型
                    if (typeof results.success !== 'number' || 
                        typeof results.failed !== 'number' || 
                        typeof results.total !== 'number' ||
                        typeof results.last_test_time !== 'string') {
                        return false;
                    }
                    
                    // 检查数组类型
                    if (!Array.isArray(results.failure_pck)) {
                        return false;
                    }
                    
                    // 检查数值合理性
                    if (results.success < 0 || results.failed < 0 || results.total < 0) {
                        return false;
                    }
                    
                    // 检查总数一致性
                    if (results.total !== results.success + results.failed) {
                        return false;
                    }
                    
                    // 检查时间格式（简单验证）
                    if (results.last_test_time.length < 10) {
                        return false;
                    }
                    
                    return true;
                    
                } catch (error) {
                    console.warn('数据验证出错:', error);
                    return false;
                }
            }
            
            // 显示真实的测试结果
            function displayRealResults(results) {
                resultSummary.style.display = 'block';
                
                const total = results.total;
                const successCount = results.success;
                const errorCount = results.failed;
                
                successCountEl.textContent = successCount;
                errorCountEl.textContent = errorCount;
                
                // 更新总计显示（如果有的话）
                if (document.getElementById('total-count')) {
                    document.getElementById('total-count').textContent = total;
                }
                
                const successPercent = total > 0 ? (successCount / total) * 100 : 0;
                updateProgressBar(successPercent);
                
                // 更新最后测试时间
                if (document.getElementById('lastTestTime')) {
                    document.getElementById('lastTestTime').textContent = results.last_test_time;
                }
                
                // 显示失败包信息（如果有）
                if (results.failure_pck && results.failure_pck.length > 0) {
                    displayFailureDetails(results.failure_pck);
                } else {
                    clearFailureDetails();
                }
            }

            // 更新进度条
            function updateProgressBar(percent) {
                progressBar.style.width = `${percent}%`;
                progressBar.classList.remove('progress-bar-animated');
                
                // 移除所有颜色类
                progressBar.classList.remove('bg-success', 'bg-warning', 'bg-danger');
                
                if (percent >= 90) {
                    progressBar.classList.add('bg-success');
                } else if (percent >= 70) {
                    progressBar.classList.add('bg-warning');
                } else {
                    progressBar.classList.add('bg-danger');
                }
            }

            // 显示失败详情
            function displayFailureDetails(failurePackages) {
                const failureList = document.getElementById('failureList');
                if (failureList) {
                    failureList.innerHTML = failurePackages.map(pkg => 
                        `<li class="list-group-item list-group-item-danger">${pkg}</li>`
                    ).join('');
                    document.getElementById('failureDetails').style.display = 'block';
                }
            }

            // 清空失败详情
            function clearFailureDetails() {
                const failureDetails = document.getElementById('failureDetails');
                if (failureDetails) {
                    failureDetails.style.display = 'none';
                }
            }

            // 更新测试结果
            async function updateResults() {
                // 先隐藏结果区域和无数据提示
                resultSummary.style.display = 'none';
                noDataMessage.style.display = 'none';
                
                try {
                    // 先检查结果文件是否存在且有效
                    const checkResponse = await fetch('/api/check-results');
                    const checkData = await checkResponse.json();
                    
                    if (checkData.exists && checkData.valid) {
                        // 文件存在且有效，获取详细数据
                        const response = await fetch('/api/test-results');
                        
                        if (response.ok) {
                            const results = await response.json();
                            displayRealResults(results);
                        } else {
                            // API返回错误
                            const errorData = await response.json();
                            console.warn('获取测试结果失败:', errorData.error);
                            noDataMessage.style.display = 'block';
                            noDataMessage.innerHTML = `<i class="bi bi-exclamation-triangle"></i> ${errorData.error || '获取数据失败'}`;
                        }
                    } else {
                        // 文件不存在或无效
                        noDataMessage.style.display = 'block';
                        if (!checkData.exists) {
                            noDataMessage.innerHTML = '<i class="bi bi-info-circle"></i> 暂无测试结果数据';
                        } else {
                            noDataMessage.innerHTML = '<i class="bi bi-exclamation-triangle"></i> 测试结果数据格式不正确';
                        }
                    }
                } catch (error) {
                    console.error('获取测试结果时出错:', error);
                    noDataMessage.style.display = 'block';
                    noDataMessage.innerHTML = '<i class="bi bi-exclamation-triangle"></i> 网络错误，无法获取测试结果';
                }
            }
            
            // 运行测试
            runBtn.addEventListener('click', function() {
                const version = versionInput.value.trim();
                const links = linksInput.value.trim();
                
                if (!version) {
                    alert('请输入版本号！');
                    return;
                }
                
                if (!links) {
                    alert('请输入至少一个链接！');
                    return;
                }
                
                // 重置状态
                logContainer.innerHTML = '';
                logLines = 0;
                lineCountEl.textContent = '0';
                resultSummary.style.display = 'none';
                noDataMessage.style.display = 'none';
                progressBar.style.width = '0%';
                progressBar.classList.remove('bg-success', 'bg-warning', 'bg-danger');
                progressBar.classList.add('progress-bar-animated');
                
                // 显示加载中
                loading.style.display = 'block';
                statusEl.textContent = '测试运行中...';
                runBtn.classList.add('running');
                runBtn.disabled = true;
                stopBtn.style.display = 'flex';
                isRunning = true;
                
                startTime = new Date();
                
                // 发送请求到后端
                fetch('/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        version: version,
                        links: links
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'started') {
                        // 开始定期获取日志
                        clearInterval(logUpdateInterval);
                        logUpdateInterval = setInterval(updateLogs, 1000);
                        
                        // 初始日志
                        addLog('测试开始启动...', 'info');
                    } else if (data.status === 'error') {
                        stopTest('启动失败');
                        addLog('启动失败: ' + data.message, 'error');
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                    stopTest('启动失败');
                    addLog('请求失败: ' + error, 'error');
                });
            });
            
            // 停止按钮事件
            stopBtn.addEventListener('click', function() {
                if (isRunning) {
                    stopTest('用户手动停止');
                }
            });
            
            // 页面加载时尝试获取测试结果
            updateResults();
            
            // 页面加载时示例数据
            versionInput.value = '';
            linksInput.value = '';
        });
    </script>
</body>
</html>
